version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinical_management
      POSTGRES_USER: cms_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_this_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - cms_network

  backend:
    build:
      context: ../backend
    container_name: cms_backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: cms_user
      DB_PASSWORD: ${DB_PASSWORD:-change_this_password}
      DB_NAME: clinical_management
      JWT_SECRET: ${JWT_SECRET:-change_this_secret}
      SERVER_IP: ${SERVER_IP:-192.168.1.10}
      FRONTEND_URL: http://${SERVER_IP:-192.168.1.10}:5173
    ports:
      - "3000:3000"
    networks:
      - cms_network

  frontend:
    build:
      context: ../frontend
    container_name: cms_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    networks:
      - cms_network

volumes:
  postgres_data:

networks:
  cms_network:
    driver: bridge
