<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Patient Queue Tracker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8f8f8; min-height: 100vh; }
  .header { background: #990000; color: white; padding: 20px 24px 16px; }
  .header h1 { font-size: 20px; font-weight: 700; }
  .header p { font-size: 12px; opacity: .8; margin-top: 2px; }
  .card { background: white; border-radius: 12px; margin: 16px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .patient-num { font-size: 24px; font-weight: 800; color: #990000; letter-spacing: 1px; }
  .stage { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid #f0f0f0; }
  .stage:last-child { border-bottom: none; }
  .dot { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; flex-shrink: 0; }
  .dot.done { background: #dcfce7; color: #166534; }
  .dot.active { background: #fef3c7; color: #92400e; animation: pulse 1.5s infinite; }
  .dot.pending { background: #f3f4f6; color: #9ca3af; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }
  .stage-info { flex: 1; }
  .stage-label { font-size: 14px; font-weight: 600; color: #222; }
  .stage-sub { font-size: 11px; color: #888; margin-top: 1px; }
  .badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; }
  .badge.done { background: #dcfce7; color: #166534; }
  .badge.active { background: #fef3c7; color: #92400e; }
  .badge.pending { background: #f3f4f6; color: #6b7280; }
  .refresh-note { text-align: center; font-size: 11px; color: #aaa; margin: 4px 0 16px; }
  .error { text-align: center; color: #999; padding: 40px 20px; }
  .spinner { text-align: center; padding: 60px 20px; color: #aaa; font-size: 14px; }
</style>
</head>
<body>
<div class="header"><h1>SOMCARE</h1><p>Patient Queue Tracker</p></div>
<div id="app"><div class="spinner">Loading your queue status&hellip;</div></div>

<script>
const API = 'https://winner-stan-giving-tamil.trycloudflare.com/api';
const params = new URLSearchParams(location.search);
const pn = params.get('pn');
const aid = params.get('aid');

const MAIN_STEPS = [
  { key: 'in_triage', label: 'Triage' },
  { key: 'with_doctor', label: 'With Doctor' },
  { key: 'ready_discharge', label: 'Ready for Discharge' },
  { key: 'completed', label: 'Complete' }
];
const MAIN_ORDER = MAIN_STEPS.map(function(s) { return s.key; });

const SUB_LABEL = { in_lab: 'Laboratory', in_radiology: 'Radiology', in_pharmacy: 'Pharmacy' };
const STATUS_LABEL = { ordered: "Ordered", sample_collected: "Sample Collected", in_progress: "In Progress", completed: "Completed", pending: "Pending", dispensed: "Dispensed" };

function escapeHtml(str) {
  var div = document.createElement("div");
  div.textContent = str == null ? "" : str;
  return div.innerHTML;
}

async function render() {
  var app = document.getElementById("app");
  if (!pn || !aid) {
    app.innerHTML = "<div class=\"error\">No tracking info found.<br/>Please scan the QR code from your receipt.</div>";
    return;
  }
  try {
    var r = await fetch(API + "/public/track?aid=" + encodeURIComponent(aid) + "&pn=" + encodeURIComponent(pn));
    if (!r.ok) {
      app.innerHTML = "<div class=\"error\">Could not find your visit.<br/>Please check with the front desk.</div>";
      return;
    }
    var data = await r.json();

    var currentIdx = MAIN_ORDER.indexOf(data.stage);
    if (currentIdx === -1) currentIdx = MAIN_ORDER.indexOf("with_doctor");

    var stepsHTML = MAIN_STEPS.map(function(s, i) {
      var state = data.stage === "cancelled" ? "pending" : (i < currentIdx ? "done" : i === currentIdx ? "active" : "pending");
      var badgeText = state === "done" ? "Done" : state === "active" ? "In Progress" : "Waiting";
      var dotText = state === "done" ? "&#10003;" : String(i + 1);
      var sub = "";
      if (s.key === "with_doctor" && data.subStage && SUB_LABEL[data.subStage]) {
        var itemLine = data.currentItem ? (" &mdash; " + escapeHtml(data.currentItem.label) + " (" + (STATUS_LABEL[data.currentItem.status] || data.currentItem.status) + ")") : "";
        sub = "Currently: " + SUB_LABEL[data.subStage] + itemLine;
      }
      return "<div class=\"stage\">" +
        "<div class=\"dot " + state + "\">" + dotText + "</div>" +
        "<div class=\"stage-info\"><div class=\"stage-label\">" + s.label + "</div>" +
        (sub ? "<div class=\"stage-sub\">" + sub + "</div>" : "") +
        "</div>" +
        "<span class=\"badge " + state + "\">" + badgeText + "</span>" +
      "</div>";
    }).join("");

    var deptLine = data.department ? "<div style=\"font-size:12px;color:#666;margin-top:4px;\">" + escapeHtml(data.department) + "</div>" : "";
    var docLine = data.doctorName ? "<div style=\"font-size:12px;color:#666;\">" + escapeHtml(data.doctorName) + "</div>" : "";

    app.innerHTML =
      "<div class=\"card\">" +
        "<div class=\"patient-num\">" + escapeHtml(pn) + "</div>" +
        deptLine + docLine +
      "</div>" +
      "<div class=\"card\">" + stepsHTML + "</div>" +
      "<div class=\"refresh-note\">Auto-refreshes every 30 seconds</div>";
  } catch (e) {
    app.innerHTML = "<div class=\"error\">Connection issue. Please retry shortly.</div>";
  }
}
render();
setInterval(render, 30000);
</script>
</body>
</html>
